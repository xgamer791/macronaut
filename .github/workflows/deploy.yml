name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supabase accounts are opt-in. Filling in url + anonKey in the committed
      # supabase.json is enough — both values are public by design, since they
      # ship inside the bundle and Row Level Security is what protects the
      # data. Repository secrets/variables of the same EXPO_PUBLIC_* names
      # still override the file, for forks pointing at another project.
      # See docs/accounts.md.
      - name: Resolve Supabase config
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/supabase-config.mjs >> "$GITHUB_ENV"

      - name: Export web build
        run: npm run export:web
        env:
          EXPO_PUBLIC_BASE_PATH: /macronaut
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # The project host is inlined at build time, so a config that never
      # reached the bundler produces a local-only site that still looks like a
      # successful deploy. Fail instead of shipping a silent downgrade.
      - name: Verify the built bundle matches the configured auth mode
        run: |
          if [ "$MACRONAUT_AUTH_MODE" = "local-only" ]; then
            echo "mode=local-only (no Supabase project configured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -rqF "$MACRONAUT_SUPABASE_HOST" dist/_expo/static/js/web/; then
            echo "mode=accounts (bundle points at $MACRONAUT_SUPABASE_HOST)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Accounts are configured but $MACRONAUT_SUPABASE_HOST is absent from the exported bundle, so this deploy would be local-only."
            exit 1
          fi

      # GitHub Pages CDN caches HTML for ~10 minutes; meta tags do not override
      # that. Write version.json and inject a tiny client script that detects a
      # new build and navigates with ?_build=… so stale tabs pick up Daily Goals
      # / Fat Goal / etc. immediately.
      - name: Publish build version + force-refresh stale clients
        run: python3 scripts/patch-pages-cachebust.py

      - name: Disable Jekyll so _expo assets are served
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
