name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue the next push instead of aborting a deploy that is already uploading.
  # Cancelling left Pages on an older SHA while main had already moved on.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The backend and the web build ship together. `convex deploy` pushes the
      # functions in convex/ to the production deployment, then runs the export
      # with EXPO_PUBLIC_CONVEX_URL set to that deployment's URL, so the bundle
      # can only ever point at the backend that was just deployed.
      #
      # CONVEX_DEPLOY_KEY is a repository secret (Settings → Secrets and
      # variables → Actions). It can deploy code, so it must never be committed
      # or placed in the bundle; nothing else in this job can read it.
      - name: Require the Convex deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set. Add the production deploy key from the Convex dashboard as a repository secret; see docs/accounts.md."
            exit 1
          fi

      # Convex Auth needs the site's own URL on the deployment for every sign-in:
      # it is where OAuth returns and what the emailed link points at. It is a
      # public value that follows the Pages URL, so the deploy sets it rather than
      # relying on it having been typed into the dashboard.
      - name: Set SITE_URL on the Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex env set SITE_URL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      # Shared xAI key for AI food scan. Lives only on the Convex deployment.
      # Add repository secret XAI_API_KEY (Settings → Secrets → Actions).
      - name: Set XAI_API_KEY on the Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "XAI_API_KEY is not set as a repository secret; AI food scan will stay unconfigured until it is."
            exit 0
          fi
          npx convex env set XAI_API_KEY "$XAI_API_KEY"

      # Google Places (New) key for home-gym search. Lives only on the
      # Convex deployment; the actions in convex/places.ts are the only code
      # that reads it. Add repository secret GOOGLE_PLACES_API_KEY.
      - name: Set GOOGLE_PLACES_API_KEY on the Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY is not set as a repository secret; home-gym search will stay unconfigured until it is."
            exit 0
          fi
          npx convex env set GOOGLE_PLACES_API_KEY "$GOOGLE_PLACES_API_KEY"

      - name: Deploy Convex functions and export the web build against them
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          EXPO_PUBLIC_BASE_PATH: /macronaut
        run: |
          npx convex deploy \
            --cmd 'npm run export:web && printf "%s\n" "$EXPO_PUBLIC_CONVEX_URL" > .convex-production-url' \
            --cmd-url-env-var-name EXPO_PUBLIC_CONVEX_URL

      # Capture the exact URL Convex supplied to the export command. Searching
      # the minified bundle is unsafe: the Convex client itself contains an
      # example happy-otter-123.convex.cloud URL before the app's real URL.
      - name: Verify the bundle points at a Convex deployment
        run: |
          BACKEND=$(tr -d '\r\n' < .convex-production-url)
          if ! printf '%s' "$BACKEND" | grep -Eq '^https://[a-z0-9-]+\.convex\.cloud$'; then
            echo "::error::Convex did not provide a valid deployment URL to the web export."
            exit 1
          fi
          if ! grep -RqsF "$BACKEND" dist/_expo/static/js/web/; then
            echo "::error::The exported bundle does not contain the Convex deployment URL it was built against."
            exit 1
          fi
          echo "backend=$BACKEND" >> "$GITHUB_STEP_SUMMARY"
          echo "CONVEX_CLOUD_URL=$BACKEND" >> "$GITHUB_ENV"
          rm -f .convex-production-url

      # GitHub Pages CDN caches HTML and version.json for ~10 minutes; meta
      # tags do not override that. Write version.json, publish the SHA on
      # Convex (uncached), and inject a client that asks Convex for the live
      # build and reloads with a unique ?_build=&_t= URL on mismatch.
      - name: Publish build version + force-refresh stale clients
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_CLOUD_URL: ${{ env.CONVEX_CLOUD_URL }}
        run: |
          npx convex env set PUBLIC_WEB_BUILD "${{ github.sha }}"
          python3 scripts/patch-pages-cachebust.py

      - name: Disable Jekyll so _expo assets are served
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
