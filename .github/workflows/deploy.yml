name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The backend and the web build ship together. `convex deploy` pushes the
      # functions in convex/ to the production deployment, then runs the export
      # with EXPO_PUBLIC_CONVEX_URL set to that deployment's URL, so the bundle
      # can only ever point at the backend that was just deployed.
      #
      # CONVEX_DEPLOY_KEY is a repository secret (Settings → Secrets and
      # variables → Actions). It can deploy code, so it must never be committed
      # or placed in the bundle; nothing else in this job can read it.
      - name: Require the Convex deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set. Add the production deploy key from the Convex dashboard as a repository secret; see docs/accounts.md."
            exit 1
          fi

      # Convex Auth needs the site's own URL on the deployment for every sign-in:
      # it is where OAuth returns and what the emailed link points at. It is a
      # public value that follows the Pages URL, so the deploy sets it rather than
      # relying on it having been typed into the dashboard.
      - name: Set SITE_URL on the Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex env set SITE_URL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Deploy Convex functions and export the web build against them
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          EXPO_PUBLIC_BASE_PATH: /macronaut
        run: npx convex deploy --cmd 'npm run export:web' --cmd-url-env-var-name EXPO_PUBLIC_CONVEX_URL

      # The deployment URL is inlined at build time, so a bundle without it is
      # an app that cannot sign in or load anything. Fail instead of shipping it.
      - name: Verify the bundle points at a Convex deployment
        run: |
          if grep -rqoE 'https://[a-z0-9-]+\.convex\.cloud' dist/_expo/static/js/web/; then
            echo "backend=$(grep -rhoE 'https://[a-z0-9-]+\.convex\.cloud' dist/_expo/static/js/web/ | head -1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No Convex deployment URL in the exported bundle; the deploy would ship an app with no backend."
            exit 1
          fi

      # GitHub Pages CDN caches HTML for ~10 minutes; meta tags do not override
      # that. Write version.json and inject a tiny client script that detects a
      # new build and navigates with ?_build=… so stale tabs pick up the new
      # bundle immediately.
      - name: Publish build version + force-refresh stale clients
        run: python3 scripts/patch-pages-cachebust.py

      - name: Disable Jekyll so _expo assets are served
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
